
name: Build CHINESE BATTLE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q CHINESE_BATTLE_Android_Project.zip

      - name: Build APK
        run: |
          cd CHINESE_BATTLE_Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CHINESE-BATTLE-APK
          path: CHINESE_BATTLE_Android/app/build/outputs/apk/debug/app-debug.apk
          
